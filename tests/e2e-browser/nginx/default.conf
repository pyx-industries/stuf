events { worker_connections 1024; }

http {
    server {
        listen 8080;
        server_name _;

        # Use Docker's embedded DNS so upstream hostnames are resolved at
        # request time rather than at Nginx startup.  This lets the proxy
        # start before zitadel-login-e2e exists (it starts after init).
        resolver 127.0.0.11 valid=5s ipv6=off;

        # Health probe for Docker Compose health checks.
        location = /healthz {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # Proxy Zitadel Login v2 UI to the separate login container.
        # The Host header is forwarded as-is so the login UI server sees
        # zitadel-e2e:8080 as its host context, not zitadel-login-e2e:8090.
        # This lets the login UI's server-side Zitadel API calls carry the
        # correct origin (zitadel-e2e), matching EXTERNALDOMAIN=zitadel-e2e.
        # Using a variable forces runtime DNS resolution (required with the
        # resolver directive to handle late-starting upstreams).
        location /ui/v2/login/ {
            set $login_upstream http://zitadel-login-e2e:8090;
            proxy_pass $login_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # All other requests go directly to Zitadel.
        location / {
            set $zitadel_upstream http://zitadel-backend-e2e:8080;
            proxy_pass $zitadel_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
