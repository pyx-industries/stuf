name: CI Tests

on:
  pull_request:
  push:
    branches: [master]

jobs:
  fast-tests:
    name: Fast Tests (Unit + Integration)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-dev.txt', 'api/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r api/requirements.txt

      - name: Run fast tests
        run: make test

  e2e-tests:
    name: E2E Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: fast-tests
    if: success()
    strategy:
      matrix:
        include:
          - name: production
            spa_build_target: production
            spa_container_port: 80
          - name: development
            spa_build_target: development
            spa_container_port: 3000

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: spa/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r api/requirements.txt

      - name: Install SPA dependencies
        working-directory: spa
        run: npm ci

      - name: Update system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg

      - name: Install browser E2E test dependencies
        run: |
          pip install -r tests/e2e-browser/requirements.txt
          playwright install --with-deps chromium

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare bootstrap directory
        run: mkdir -p tests/e2e-browser/.zitadel-bootstrap

      - name: Run E2E tests
        run: make test-e2e
        env:
          SPA_BUILD_TARGET: ${{ matrix.spa_build_target }}
          SPA_CONTAINER_PORT: ${{ matrix.spa_container_port }}

      - name: Show Docker containers and logs on failure
        if: failure()
        run: |
          echo "=== Docker containers ==="
          docker ps -a
          echo "=== Docker compose services ==="
          docker compose -f tests/e2e-browser/docker-compose.e2e-browser.yml --profile zitadel ps
          echo "=== Zitadel logs ==="
          docker compose -f tests/e2e-browser/docker-compose.e2e-browser.yml --profile zitadel logs zitadel-e2e || echo "No Zitadel logs available"
          echo "=== Zitadel init logs ==="
          docker compose -f tests/e2e-browser/docker-compose.e2e-browser.yml --profile zitadel logs zitadel-init-e2e || echo "No Zitadel init logs available"
          echo "=== Zitadel login logs ==="
          docker compose -f tests/e2e-browser/docker-compose.e2e-browser.yml --profile zitadel logs zitadel-login-e2e || echo "No Zitadel login logs available"
          echo "=== API logs ==="
          docker compose -f tests/e2e-browser/docker-compose.e2e-browser.yml --profile zitadel logs api-e2e || echo "No API logs available"
          echo "=== SPA logs ==="
          docker compose -f tests/e2e-browser/docker-compose.e2e-browser.yml --profile zitadel logs spa-e2e || echo "No SPA logs available"
          echo "=== Bootstrap generated.env ==="
          cat tests/e2e-browser/.zitadel-bootstrap/generated.env || echo "No generated.env"

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports-zitadel
          path: tests/e2e-browser/reports/
          retention-days: 3

  publish-containers:
    name: Publish Container Images
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    if: success() && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish containers
        run: make publish-containers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Output published images
        run: |
          echo "Published container images:"
          echo "- ghcr.io/${{ github.repository }}-api:latest"
          echo "- ghcr.io/${{ github.repository }}-api:$(git rev-parse --short HEAD)"
          echo "- ghcr.io/${{ github.repository }}-spa:latest"
          echo "- ghcr.io/${{ github.repository }}-spa:$(git rev-parse --short HEAD)"
